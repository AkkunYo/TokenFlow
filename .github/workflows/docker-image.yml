name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装测试依赖
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements.txt coverage

      - name: 获取版本号与构建时间
        run: |
          TAG=$(git tag --sort=-v:refname | head -n 1)

          if [ -z "$TAG" ]; then
            BUILD_NUM=$(git rev-list --count HEAD)
            MAJOR=$((BUILD_NUM / 100 + 1))
            MINOR=$(((BUILD_NUM % 100) / 10))
            PATCH=$((BUILD_NUM % 10))
            TAG="v$MAJOR.$MINOR.$PATCH"
          fi

          BUILD_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          echo "VERSION=$TAG" >> $GITHUB_ENV
          echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
          echo "$TAG" > VERSION
          echo "最终版本: $TAG"
          echo "构建时间: $BUILD_TIME"

      - name: 运行单元测试
        run: |
          bash scripts/test_all.sh
          PYTHONPATH="services/gemflow:packages/egress:apps/tokenflow" \
            python3 -m coverage run --branch -m unittest discover \
              -s apps/tokenflow/tests -p "test_cpa_proxy_config.py"
          python3 -m coverage report --include=apps/tokenflow/cpa_proxy_config.py --fail-under=80

      - name: 校验运行时配置与脚本
        run: |
          python3 -m py_compile \
            apps/tokenflow/cpa_proxy_config.py \
            services/gemflow/gen_workers.py \
            services/gemflow/lb_gateway.py \
            services/gemflow/run_local.py \
            packages/egress/assign_worker_nodes.py \
            packages/egress/mihomo_config.py \
            packages/egress/vpngate_provider.py
          bash -n apps/tokenflow/start.sh services/gemflow/start.sh install.sh scripts/test_all.sh
          docker compose config --quiet

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 登录阿里云镜像仓库
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BUILD_VERSION=${{ env.VERSION }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          tags: |
            registry.cn-hangzhou.aliyuncs.com/zkyml/tokenflow:latest
            registry.cn-hangzhou.aliyuncs.com/zkyml/tokenflow:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: 打印可用镜像地址
        if: github.event_name != 'pull_request'
        run: |
          echo "=================================================="
          echo "🎉 Docker 镜像构建并推送成功！"
          echo "--------------------------------------------------"
          echo "可直接拉取使用的镜像地址："
          echo "  - registry.cn-hangzhou.aliyuncs.com/zkyml/tokenflow:latest"
          echo "  - registry.cn-hangzhou.aliyuncs.com/zkyml/tokenflow:${{ env.VERSION }}"
          echo ""
          echo "拉取命令示例："
          echo "  docker pull registry.cn-hangzhou.aliyuncs.com/zkyml/tokenflow:latest"
          echo "  docker pull registry.cn-hangzhou.aliyuncs.com/zkyml/tokenflow:${{ env.VERSION }}"
          echo "=================================================="

          echo "### 🚀 Docker 镜像构建并推送成功" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest**: \`registry.cn-hangzhou.aliyuncs.com/zkyml/tokenflow:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Versioned**: \`registry.cn-hangzhou.aliyuncs.com/zkyml/tokenflow:${{ env.VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull registry.cn-hangzhou.aliyuncs.com/zkyml/tokenflow:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker pull registry.cn-hangzhou.aliyuncs.com/zkyml/tokenflow:${{ env.VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
